server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Blazor публикует рядом с файлами готовые .gz
    gzip_static on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    types { application/wasm wasm; }

    # add_header в location отменяет унаследованные, поэтому заголовки безопасности подключены в каждом
    # Файлы _framework имеют отпечаток в имени - можно кэшировать надолго
    location /_framework/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        # SPA: неизвестные пути отдают index.html (в приложении есть маршрут /{*Path})
        try_files $uri $uri/ /index.html;
    }
}
