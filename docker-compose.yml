# Онлайн-версия PassGen (Blazor WebAssembly, статику раздаёт Caddy).
# Параметры задаются переменными окружения или файлом .env рядом с compose-файлом.
#
#   PASSGEN_BIND  - адрес хоста, на котором публикуется порт (по умолчанию 127.0.0.1)
#   PASSGEN_PORT  - порт на хосте (по умолчанию 8080)
#   PASSGEN_IMAGE - образ (по умолчанию ghcr.io/onecodeunit/passgen:latest)
#   CADDY_NETWORK - внешняя docker-сеть обратного прокси (по умолчанию proxy)
#
# Обратный прокси обращается к контейнеру по имени: reverse_proxy passgen-web:8080

services:
  passgen-web:
    # Готовый образ собирает и публикует GitHub Actions (.github/workflows/docker-publish.yml).
    # Чтобы собрать из исходников: docker compose up -d --build
    image: ${PASSGEN_IMAGE:-ghcr.io/onecodeunit/passgen:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: passgen-web
    restart: unless-stopped
    ports:
      - "${PASSGEN_BIND:-127.0.0.1}:${PASSGEN_PORT:-8080}:8080"
    # Сайт статический: файловая система только для чтения, лишних прав нет.
    # NET_BIND_SERVICE нужен только потому, что на бинарнике Caddy выставлена эта
    # capability - без неё при cap_drop: ALL контейнер не запустится.
    read_only: true
    tmpfs:
      - /data
      - /config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - proxy

networks:
  proxy:
    name: ${CADDY_NETWORK:-proxy}
    external: true
