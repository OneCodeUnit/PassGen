version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    groups:
      blazor:
        patterns:
          - "Microsoft.AspNetCore.Components.WebAssembly*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
